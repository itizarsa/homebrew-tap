name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  casks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check style
        run: brew style Casks/claudex.rb
      - name: Audit cask
        run: brew audit --cask --new Casks/claudex.rb
