name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  casks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check style
        run: brew style Casks/claudex.rb
      - name: Trust cask
        run: brew trust --cask itizarsa/tap/claudex
      - name: Fetch release
        if: github.event_name == 'push'
        run: |
          brew tap itizarsa/tap
          brew fetch --cask itizarsa/tap/claudex
